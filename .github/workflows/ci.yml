name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  server:
    name: Server (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore AiIncubator.slnx
      - name: Build
        run: dotnet build AiIncubator.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test AiIncubator.slnx --configuration Release --no-build

  client:
    name: Client (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/AiIncubator.Client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/AiIncubator.Client/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
